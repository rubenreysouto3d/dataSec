name: source-health

on:
  push:
    branches: [main]
    paths:
      - "scripts/check-police-contract.mjs"
      - "scripts/check-madrid-contract.mjs"
      - "scripts/check-madrid-population-contract.mjs"
      - "scripts/check-madrid-activity-contract.mjs"
      - "data/sources/london.json"
      - "data/sources/madrid.json"
      - ".github/workflows/source-health.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  london-police-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate data.police.uk contract
        run: node scripts/check-police-contract.mjs

  madrid-police-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate datos.madrid.es contract
        run: node scripts/check-madrid-contract.mjs

  madrid-population:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Madrid population contract
        run: node scripts/check-madrid-population-contract.mjs

  madrid-activity-context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect aligned Madrid commercial-activity source
        run: node scripts/check-madrid-activity-contract.mjs
