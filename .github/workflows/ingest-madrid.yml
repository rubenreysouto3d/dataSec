name: ingest-madrid

on:
  schedule:
    - cron: "47 5 5,20 * *"
  push:
    branches: [main]
    paths:
      - "scripts/ingest_madrid.py"
      - "scripts/backfill_madrid.py"
      - "scripts/fetch-json-node.mjs"
      - "tests/test_ingest_madrid.py"
      - "data/sources/madrid.json"
      - ".github/workflows/ingest-madrid.yml"
  workflow_dispatch:
    inputs:
      month:
        description: "Optional latest/source month (YYYY-MM). Leave blank for latest."
        required: false
        type: string
      history_count:
        description: "Months to process ending at the selected/latest month (1-24)"
        required: true
        default: "1"
        type: string
      persist:
        description: "Persist validated data to Supabase"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  dry-run:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.persist != true)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate Madrid ingestion end to end
        shell: bash
        run: |
          history_count="1"
          month=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            history_count="${{ inputs.history_count }}"
            month="${{ inputs.month }}"
          fi

          if ! [[ "$history_count" =~ ^[0-9]+$ ]] || [ "$history_count" -lt 1 ] || [ "$history_count" -gt 24 ]; then
            echo "::error::history_count must be an integer between 1 and 24"
            exit 1
          fi

          if [ "$history_count" -gt 1 ]; then
            args=(--count "$history_count" --dry-run)
            if [ -n "$month" ]; then
              args+=(--latest "$month")
            fi
            python scripts/backfill_madrid.py "${args[@]}"
          else
            args=(--dry-run)
            if [ -n "$month" ]; then
              args+=(--month "$month")
            fi
            python scripts/ingest_madrid.py "${args[@]}"
          fi

  persist:
    if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.persist == true)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: https://pjyaevghxbimhknvmbxb.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Persist Madrid ingestion
        shell: bash
        run: |
          history_count="1"
          month=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            history_count="${{ inputs.history_count }}"
            month="${{ inputs.month }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ github.event.head_commit.message }}" != "ops: backfill 13 months Madrid" ]; then
              echo "Push is not the explicit Madrid history backfill; skipping persistence."
              exit 0
            fi
            history_count="13"
          fi

          if ! [[ "$history_count" =~ ^[0-9]+$ ]] || [ "$history_count" -lt 1 ] || [ "$history_count" -gt 24 ]; then
            echo "::error::history_count must be an integer between 1 and 24"
            exit 1
          fi

          if [ "$history_count" -gt 1 ]; then
            args=(--count "$history_count")
            if [ -n "$month" ]; then
              args+=(--latest "$month")
            fi
            python scripts/backfill_madrid.py "${args[@]}"
          else
            args=()
            if [ -n "$month" ]; then
              args+=(--month "$month")
            fi
            python scripts/ingest_madrid.py "${args[@]}"
          fi
