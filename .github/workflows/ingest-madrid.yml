name: ingest-madrid

on:
  schedule:
    - cron: "47 5 5,20 * *"
  push:
    branches: [main]
    paths:
      - "scripts/ingest_madrid.py"
      - "scripts/fetch-json-node.mjs"
      - "tests/test_ingest_madrid.py"
      - "data/sources/madrid.json"
      - ".github/workflows/ingest-madrid.yml"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to ingest (YYYY-MM); blank uses latest"
        required: false
        type: string
      persist:
        description: "Persist validated data to Supabase"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  dry-run:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.persist != true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate Madrid ingestion end to end
        shell: bash
        run: |
          args=(--dry-run)
          if [ -n "${{ inputs.month }}" ]; then
            args+=(--month "${{ inputs.month }}")
          fi
          python scripts/ingest_madrid.py "${args[@]}"

  persist:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.persist == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://pjyaevghxbimhknvmbxb.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check backend credential
        id: credential
        shell: bash
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ] && [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Scheduled Madrid ingest skipped because no Supabase backend key is configured."
            else
              echo "::error::Persistent Madrid ingest requires SUPABASE_SECRET_KEY or SUPABASE_SERVICE_ROLE_KEY."
              exit 1
            fi
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Persist Madrid ingestion
        if: steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          args=()
          if [ -n "${{ inputs.month }}" ]; then
            args+=(--month "${{ inputs.month }}")
          fi
          python scripts/ingest_madrid.py "${args[@]}"
