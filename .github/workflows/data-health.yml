name: data-health

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/check-data-store.mjs
