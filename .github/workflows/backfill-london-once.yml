name: cleanup-backfill-once

on:
  push:
    paths:
      - ".github/workflows/backfill-london-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove one-time backfill workflow
        shell: bash
        run: |
          git config user.name "dataSec maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/backfill-london-once.yml
          git commit -m "chore: remove one-time London backfill workflow"
          git push
