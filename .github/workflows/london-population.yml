name: london-population

on:
  push:
    branches: [main]
    paths:
      - "scripts/ingest_london_population.py"
      - ".github/workflows/london-population.yml"
  workflow_dispatch:
    inputs:
      persist:
        description: "Persist validated London ward population to Supabase"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  population:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://pjyaevghxbimhknvmbxb.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install workbook parser
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Validate London ward population
        run: python scripts/ingest_london_population.py --dry-run
      - name: Persist validated London ward population
        if: ${{ github.event_name == 'push' || inputs.persist }}
        run: python scripts/ingest_london_population.py
