name: cleanup-ingest-staging

on:
  push:
    paths:
      - ".github/workflows/ingest-london-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove one-time ingest staging files
        shell: bash
        run: |
          git config user.name "dataSec ingest bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -r tmp_ingest .github/workflows/ingest-london-once.yml
          git commit -m "chore: clean one-time London ingest staging"
          git push
