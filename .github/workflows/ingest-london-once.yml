name: ingest-london-once

on:
  push:
    paths:
      - ".github/workflows/ingest-london-once.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate temporary SQL chunks from official London data
        shell: bash
        run: |
          rm -rf tmp_ingest
          mkdir -p tmp_ingest
          python - <<'PY'
          import calendar
          import hashlib
          import json
          import pathlib
          import uuid
          from collections import Counter
          from scripts import ingest_london as il

          out = pathlib.Path("tmp_ingest")

          def q(value):
              if value is None:
                  return "null"
              return "'" + str(value).replace("'", "''") + "'"

          def write(name, sql):
              (out / name).write_text("begin;\n" + sql + "\ncommit;\n", encoding="utf-8")

          month = il.latest_month()
          crime_blob = il.custom_download(month)
          crime_checksum = hashlib.sha256(crime_blob).hexdigest()
          rows = il.parse_crime_zip(crime_blob, month)
          categories = il.source_categories(month)
          areas, boundary_checksum = il.fetch_neighbourhoods(month)
          grid = il.build_grid(areas)

          aggregates = Counter()
          unmatched = 0
          unknown_categories = Counter()

          for row in rows:
              lon_text = (row.get("Longitude") or "").strip()
              lat_text = (row.get("Latitude") or "").strip()
              if not lon_text or not lat_text:
                  unmatched += 1
                  continue
              try:
                  lon = float(lon_text)
                  lat = float(lat_text)
              except ValueError:
                  unmatched += 1
                  continue
              area_source_id = il.locate_area(lon, lat, areas, grid)
              if area_source_id is None:
                  unmatched += 1
                  continue
              source_name = (row.get("Crime type") or "").strip()
              metric_slug = categories.get(source_name)
              if metric_slug is None:
                  unknown_categories[source_name] += 1
                  continue
              aggregates[(area_source_id, metric_slug)] += 1

          if unknown_categories:
              raise RuntimeError(f"Unknown categories: {dict(unknown_categories)}")
          ratio = unmatched / max(len(rows), 1)
          if len(rows) - unmatched < 1000 or ratio > 0.05:
              raise RuntimeError(f"Quality gate failed: matched={len(rows)-unmatched}, unmatched_ratio={ratio:.2%}")

          year, month_number = map(int, month.split("-"))
          period_start = f"{month}-01"
          period_end = f"{month}-{calendar.monthrange(year, month_number)[1]:02d}"
          run_id = str(uuid.uuid4())

          seed = []
          seed.append("""
          insert into public.countries(code,name) values ('GB','United Kingdom')
          on conflict(code) do update set name=excluded.name;
          """)
          seed.append("""
          insert into public.cities(slug,country_code,name,timezone)
          values ('london','GB','London','Europe/London')
          on conflict(slug) do update set country_code=excluded.country_code,name=excluded.name,timezone=excluded.timezone;
          """)
          seed.append("""
          insert into public.sources(slug,authority,source_url,licence,update_frequency,source_type,granularity,notes)
          values (
            'uk-police-open-data',
            'Single Online Home National Digital Team / UK Police',
            'https://data.police.uk/',
            'Open Government Licence v3.0',
            'monthly',
            'police-recorded street-level crime',
            'anonymised point locations and neighbourhood policing boundaries',
            'Locations are approximate; recorded crime is not equivalent to personal risk.'
          )
          on conflict(slug) do update set
            authority=excluded.authority,
            source_url=excluded.source_url,
            licence=excluded.licence,
            update_frequency=excluded.update_frequency,
            source_type=excluded.source_type,
            granularity=excluded.granularity,
            notes=excluded.notes;
          """)
          metric_values = []
          for name, slug in sorted(categories.items()):
              metric_values.append(f"({q(slug)},{q(name)},'recorded_crime',{q('Police-recorded '+name.lower()+' incidents.')},null)")
          seed.append("""
          insert into public.metrics(slug,label,family,description,higher_is_worse) values
          """ + ",\n".join(metric_values) + """
          on conflict(slug) do update set
            label=excluded.label,
            family=excluded.family,
            description=excluded.description,
            higher_is_worse=excluded.higher_is_worse;
          """)
          write("000_seed.sql", "\n".join(seed))

          for chunk_no, start in enumerate(range(0, len(areas), 100), 1):
              chunk = areas[start:start+100]
              vals = []
              for area in chunk:
                  source_id = str(area["source_area_id"])
                  area_id = f"gb-london-metropolitan:{source_id}"
                  name = str(area["name"])
                  vals.append(
                      f"({q(area_id)},'london','uk-police-open-data',{q(source_id)},null,'police_neighbourhood',{q(il.slugify(name))},{q(name)},null,true)"
                  )
              sql = """
              insert into public.areas(id,city_slug,source_slug,source_area_id,parent_area_id,area_type,slug,name,population,active) values
              """ + ",\n".join(vals) + """
              on conflict(id) do update set
                city_slug=excluded.city_slug,
                source_slug=excluded.source_slug,
                source_area_id=excluded.source_area_id,
                parent_area_id=excluded.parent_area_id,
                area_type=excluded.area_type,
                slug=excluded.slug,
                name=excluded.name,
                population=excluded.population,
                active=excluded.active;
              """
              write(f"1{chunk_no:02d}_areas.sql", sql)

          for chunk_no, start in enumerate(range(0, len(areas), 25), 1):
              chunk = areas[start:start+25]
              vals = []
              for area in chunk:
                  source_id = str(area["source_area_id"])
                  area_id = f"gb-london-metropolitan:{source_id}"
                  wkt = il.multipolygon_wkt(area["polygons"])
                  source_hash = hashlib.sha256(wkt.encode("utf-8")).hexdigest()
                  vals.append(
                      f"({q(area_id)},'uk-police-open-data',{q(period_start)},extensions.ST_GeomFromText({q(wkt)},4326),{q(source_hash)})"
                  )
              sql = """
              insert into public.area_boundaries(area_id,source_slug,period_start,geometry,source_hash) values
              """ + ",\n".join(vals) + """
              on conflict(area_id,period_start) do update set
                source_slug=excluded.source_slug,
                geometry=excluded.geometry,
                source_hash=excluded.source_hash;
              """
              write(f"2{chunk_no:02d}_boundaries.sql", sql)

          metric_slugs = sorted(set(categories.values()))
          obs = []
          provenance = json.dumps({
              "source_month": month,
              "location_model": "anonymised_point_assigned_to_same_month_police_neighbourhood_boundary"
          }, separators=(",", ":"))
          for area in areas:
              source_id = str(area["source_area_id"])
              area_id = f"gb-london-metropolitan:{source_id}"
              for metric_slug in metric_slugs:
                  value = aggregates.get((source_id, metric_slug), 0)
                  obs.append(
                      f"({q(area_id)},'uk-police-open-data',{q(metric_slug)},{q(period_start)},{q(period_end)},{value},'count',{value},null,{q(provenance)}::jsonb)"
                  )

          for chunk_no, start in enumerate(range(0, len(obs), 500), 1):
              vals = obs[start:start+500]
              sql = """
              insert into public.observations(area_id,source_slug,metric_slug,period_start,period_end,value,unit,numerator,denominator,provenance) values
              """ + ",\n".join(vals) + """
              on conflict(area_id,source_slug,metric_slug,period_start,period_end,unit) do update set
                value=excluded.value,
                numerator=excluded.numerator,
                denominator=excluded.denominator,
                provenance=excluded.provenance;
              """
              write(f"3{chunk_no:02d}_observations.sql", sql)

          diagnostics = json.dumps({
              "unmatched_rows": unmatched,
              "crime_zip_sha256": crime_checksum,
              "boundary_zip_sha256": boundary_checksum,
              "boundary_model": "same_month_police_neighbourhood_archive"
          }, separators=(",", ":"))
          final_sql = f"""
          insert into public.ingestion_runs(
            id,source_slug,started_at,finished_at,status,source_version,row_count,matched_row_count,checksum,diagnostics
          ) values (
            {q(run_id)},'uk-police-open-data',now(),now(),'passed',{q(month)},{len(rows)},{len(rows)-unmatched},{q(crime_checksum)},{q(diagnostics)}::jsonb
          )
          on conflict(id) do nothing;
          """
          if unmatched:
              details = json.dumps({"ratio": ratio}, separators=(",", ":"))
              final_sql += f"""
              insert into public.data_quality_flags(ingestion_run_id,severity,code,message,details)
              values (
                {q(run_id)},
                'warning',
                'unmatched_crime_points',
                {q(str(unmatched)+' source rows could not be assigned to a Metropolitan Police neighbourhood.')},
                {q(details)}::jsonb
              );
              """
          write("999_finalize.sql", final_sql)

          manifest = {
              "month": month,
              "source_rows": len(rows),
              "matched_rows": len(rows) - unmatched,
              "unmatched_rows": unmatched,
              "unmatched_ratio": ratio,
              "neighbourhoods": len(areas),
              "metrics": len(metric_slugs),
              "observations": len(obs),
              "crime_zip_sha256": crime_checksum,
              "boundary_zip_sha256": boundary_checksum,
              "run_id": run_id,
          }
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          PY
      - name: Commit temporary SQL chunks
        shell: bash
        run: |
          git config user.name "dataSec ingest bot"
          git config user.email "actions@users.noreply.github.com"
          git add tmp_ingest
          git commit -m "chore: stage London ingest data"
          git push
