name: ingest-smoke-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ingest-smoke-once.yml"

permissions:
  contents: read

jobs:
  london-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # v2: monthly archived NPT boundaries
      - name: Exercise official London data pipeline without persistence
        run: python scripts/ingest_london.py --dry-run
