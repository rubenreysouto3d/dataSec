name: ingest-london

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ingest-london.yml"
  schedule:
    - cron: "17 5 5,20 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Optional source month (YYYY-MM). Leave blank for latest."
        required: false
        type: string
      dry_run:
        description: "Run full source pipeline without writing to Supabase"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    if: github.event_name != 'push' || github.event.head_commit.message == 'ops: run London hierarchy with authorized workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://pjyaevghxbimhknvmbxb.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run London ingestion
        shell: bash
        run: |
          args=()
          if [ "${{ github.event_name }}" != "schedule" ]; then
            if [ -n "${{ inputs.month }}" ]; then
              args+=(--month "${{ inputs.month }}")
            fi
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              args+=(--dry-run)
            fi
          fi
          python scripts/ingest_london.py "${args[@]}"
