name: ingest-london

on:
  schedule:
    - cron: "17 5 5,20 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Optional source month (YYYY-MM). Leave blank for latest."
        required: false
        type: string
      dry_run:
        description: "Run full source pipeline without writing to Supabase"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://pjyaevghxbimhknvmbxb.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Acquire short-lived GitHub OIDC token
        shell: bash
        run: |
          response="$(curl -fsSL \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=datasec-supabase-ingest")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          echo "::add-mask::$token"
          echo "DATASEC_INGEST_GATEWAY_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Run London ingestion
        shell: bash
        run: |
          args=()
          if [ "${{ github.event_name }}" != "schedule" ]; then
            if [ -n "${{ inputs.month }}" ]; then
              args+=(--month "${{ inputs.month }}")
            fi
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              args+=(--dry-run)
            fi
          fi
          python scripts/ingest_london.py "${args[@]}"
