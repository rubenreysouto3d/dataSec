name: ingest-london

on:
  schedule:
    - cron: "17 5 5,20 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Optional source month (YYYY-MM). Leave blank for latest."
        required: false
        type: string
      dry_run:
        description: "Run full source pipeline without writing to Supabase"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://pjyaevghxbimhknvmbxb.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run London ingestion
        shell: bash
        run: |
          args=()

          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ -z "$SUPABASE_SECRET_KEY" ] && [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
              echo "::notice::Scheduled London ingest skipped because no Supabase backend key is configured."
              exit 0
            fi
          else
            if [ -n "${{ inputs.month }}" ]; then
              args+=(--month "${{ inputs.month }}")
            fi
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              args+=(--dry-run)
            elif [ -z "$SUPABASE_SECRET_KEY" ] && [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
              echo "::error::Persistent London ingest requires SUPABASE_SECRET_KEY or SUPABASE_SERVICE_ROLE_KEY."
              exit 1
            fi
          fi

          python scripts/ingest_london.py "${args[@]}"
