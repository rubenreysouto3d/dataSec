name: ingest-london

on:
  schedule:
    - cron: "17 5 5,20 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Optional latest/source month (YYYY-MM). Leave blank for latest."
        required: false
        type: string
      history_count:
        description: "Months to process ending at the selected/latest month (1-24)"
        required: true
        default: "1"
        type: string
      dry_run:
        description: "Run full source pipeline without writing to Supabase"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: https://pjyaevghxbimhknvmbxb.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run London ingestion
        shell: bash
        run: |
          history_count="1"
          month=""
          dry_run="false"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            history_count="${{ inputs.history_count }}"
            month="${{ inputs.month }}"
            dry_run="${{ inputs.dry_run }}"
          fi

          if ! [[ "$history_count" =~ ^[0-9]+$ ]] || [ "$history_count" -lt 1 ] || [ "$history_count" -gt 24 ]; then
            echo "::error::history_count must be an integer between 1 and 24"
            exit 1
          fi

          if [ "$history_count" -gt 1 ]; then
            args=(--count "$history_count")
            if [ -n "$month" ]; then
              args+=(--latest "$month")
            fi
            if [ "$dry_run" = "true" ]; then
              args+=(--dry-run)
            fi
            python scripts/backfill_london.py "${args[@]}"
          else
            args=()
            if [ -n "$month" ]; then
              args+=(--month "$month")
            fi
            if [ "$dry_run" = "true" ]; then
              args+=(--dry-run)
            fi
            python scripts/ingest_london.py "${args[@]}"
          fi
